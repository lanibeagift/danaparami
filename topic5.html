<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { serif: ['Lora', 'serif'], sans: ['Inter', 'sans-serif'] },
        colors: {
          sand: { 50: '#FAF7F2', 100: '#F3EEE5', 200: '#E8DFD0', 300: '#D8CAB0' },
          clay: { 500: '#A0784F', 600: '#8B6240', 700: '#6E4C30' },
          moss: { 400: '#8FA37E', 500: '#6E8463', 600: '#54664C' },
          ink:  { 700: '#3F3A33', 800: '#2C2925', 900: '#1C1A17' }
        }
      }
    }
  }
</script>
<title>Checking Questions - Category 03</title>
<style>
  body { background: #FAF7F2; color: #2C2925; font-family: 'Inter', sans-serif; }
  .font-display { font-family: 'Lora', serif; }
  .card-zen { background: #FFFFFF; border: 1px solid rgba(216, 202, 176, 0.55); box-shadow: 0 12px 30px -18px rgba(110, 76, 48, 0.18); }
  .tab-active { border-bottom: 2px solid #6E8463; color: #6E8463; font-weight: 600; }
  .tab-inactive { color: #A0784F; border-bottom: 2px solid transparent; }
  .tab-inactive:hover { color: #6E8463; border-bottom: 2px solid rgba(110, 132, 99, 0.3); }
  
  .mic-active { animation: pulse-red 1.5s infinite; color: #ef4444 !important; border-color: #ef4444 !important; }
  @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
  
  .fade-in-up { animation: fadeInUp 0.4s ease-out; }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .custom-scrollbar::-webkit-scrollbar { width: 6px; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #D8CAB0; border-radius: 10px; }
  .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body class="min-h-screen flex flex-col">

<header class="border-b border-sand-200/70 bg-sand-50/90 backdrop-blur-md sticky top-0 z-30">
  <div class="max-w-5xl mx-auto px-5 py-4 flex items-center justify-between">
    <div class="flex items-center gap-4">
      <a href="index.html" class="p-2 hover:bg-sand-100 rounded-full transition-colors">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6E4C30" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </a>
      <div>
        <div class="text-[10px] uppercase tracking-[0.2em] text-clay-600 font-medium">Category 03</div>
        <div class="font-display text-lg font-medium leading-tight">Checking Questions</div>
      </div>
    </div>
  </div>
</header>

<main class="flex-grow max-w-5xl mx-auto w-full px-5 py-8 flex flex-col">
  <nav class="flex overflow-x-auto mb-8 border-b border-sand-200 custom-scrollbar" id="tabNav"></nav>
  <div id="workspace" class="flex-grow flex flex-col justify-center"></div>
</main>

<script>
  // Dữ liệu câu trích xuất từ tài liệu Cate 3
  const LESSON_DATA = [
    { en: "Are you aware of the breathing? Are you aware of the in-going breath, out-going breath?", vn: "Quý vị có ý thức được hơi thở của mình không? Quý vị có ý thức được hơi thở đi vào, hơi thở đi ra không?" },
    { en: "If the mind wanders away, how quickly can you bring it back to the breathing?", vn: "Nếu tâm bỏ đi lang thang, trong bao lâu quý vị có thể nhanh chóng mang tâm trở về quan sát hơi thở?" },
    { en: "Do you feel any sensations in this area?", vn: "Quý vị có cảm nhận được cảm giác trong vùng này không?" },
    { en: "What kind of sensations?", vn: "Là loại cảm giác gì?" },
    { en: "Are you able to move your attention from head to feet to feel the sensations?", vn: "Quý vị có thể đưa sự chú tâm đi từ đầu đến chân để cảm nhận cảm giác không?" },
    { en: "Can you observe the similar parts simultaneously and symmetrically, like both arms or both legs?", vn: "Quý vị có thể quan sát các phần trên cơ thể đối xứng nhau cùng 1 lúc, ví dụ như là cả 2 tay hay cả 2 chân?" },
    { en: "Can you maintain the awareness of the natural breathing for at least one minute?", vn: "Quý vị có duy trì được sự ý thức về hơi thở trong ít nhất 1 phút không?" },
    { en: "Do you work with the free flow or part by part?", vn: "Quý vị thực tập với luồng thông suốt hay quan sát từng phần cơ thể?" },
    { en: "How is your equanimity? (or Are you equanimous?)", vn: "Sự bình tâm của quý vị ra sao? (Quý vị có bình tâm không?)" },
    { en: "Sweep en masse", vn: "Quét một lượt khắp toàn thân" }
  ];

  let currentTab = 'read';
  let currentIndex = 0;

  // --- HÀM MICROPHONE (VOICE-TO-TEXT) --- BẢN VÁ LỖI ANDROID
  function startSpeech(langCode, targetId, btnId) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert("Trình duyệt này không hỗ trợ nhận diện giọng nói. Hãy dùng Chrome hoặc Safari.");
      return;
    }

    const recognition = new SpeechRecognition();
    const micBtn = document.getElementById(btnId);
    const textArea = document.getElementById(targetId);

    recognition.lang = langCode;
    recognition.interimResults = true; // Bật để hiện chữ real-time trên Android
    recognition.maxAlternatives = 1;

    const originalText = textArea.value;

    recognition.onstart = () => {
      micBtn.classList.add('mic-active');
      micBtn.innerHTML = `<svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg> Đang nghe...`;
    };

    recognition.onresult = (event) => {
      let currentTranscript = '';
      for (let i = 0; i < event.results.length; i++) {
        currentTranscript += event.results[i][0].transcript;
      }
      textArea.value = originalText + (originalText && currentTranscript ? ' ' : '') + currentTranscript;
    };

    recognition.onerror = (event) => { console.error(event.error); };

    recognition.onend = () => {
      micBtn.classList.remove('mic-active');
      micBtn.innerHTML = `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg> Bấm nói`;
    };

    recognition.start();
  }

  function playAudio(text) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = 0.85; 
    window.speechSynthesis.speak(utterance);
  }

  function renderTabs() {
    const TABS = [
      { id: 'read', icon: '📖', label: 'Reading' },
      { id: 'shadow', icon: '🗣️', label: 'Shadowing' },
      { id: 'dict', icon: '🎧', label: 'Dictation' },
      { id: 'entovn', icon: '🇬🇧➔🇻🇳', label: 'Eng-Vn' },
      { id: 'vntoen', icon: '🇻🇳➔🇬🇧', label: 'Vn-Eng' }
    ];
    document.getElementById('tabNav').innerHTML = TABS.map(tab => `
      <button onclick="switchTab('${tab.id}')" class="px-4 py-3 whitespace-nowrap text-sm transition-all ${currentTab === tab.id ? 'tab-active' : 'tab-inactive'}">
        <span class="mr-2">${tab.icon}</span>${tab.label}
      </button>
    `).join('');
  }

  function switchTab(tabId) {
    currentTab = tabId; currentIndex = 0;
    window.speechSynthesis.cancel();
    renderTabs(); renderWorkspace();
  }

  function renderPagination(total, current, onNext, onPrev) {
    return `
      <div class="flex justify-between items-center mt-8 text-clay-600">
        <button onclick="${onPrev}" class="px-4 py-2 hover:bg-sand-100 rounded-lg disabled:opacity-30" ${current === 0 ? 'disabled' : ''}>← Trước</button>
        <div class="text-xs font-medium">${current + 1} / ${total}</div>
        <button onclick="${onNext}" class="px-4 py-2 hover:bg-sand-100 rounded-lg disabled:opacity-30" ${current === total - 1 ? 'disabled' : ''}>Sau →</button>
      </div>
    `;
  }

  // --- 0. READING ---
  function renderReading() {
    const textPairs = [
      {
        isHeader: true,
        en: "CHECKING QUESTIONS",
        vn: "CÁC CÂU HỎI KIỂM PHÁP THƯỜNG GẶP"
      },
      ...LESSON_DATA
    ];

    const rowsHtml = textPairs.map(pair => {
      if (pair.isHeader) {
        return `
          <div class="col-span-1 md:col-span-2 text-center mt-4 mb-6">
            <h2 class="font-display text-2xl md:text-3xl text-ink-900 font-medium">${pair.en}</h2>
            <h2 class="font-display text-xl md:text-2xl text-clay-600 mt-2 italic">${pair.vn}</h2>
            <div class="w-16 h-1 bg-moss-50 mx-auto mt-4 rounded-full"></div>
          </div>
        `;
      }
      return `
        <div class="bg-sand-50/50 p-4 rounded-xl text-ink-800 text-sm md:text-base leading-relaxed border border-sand-100">${pair.en}</div>
        <div class="bg-white p-4 rounded-xl text-clay-700 text-sm md:text-base leading-relaxed border border-sand-100">${pair.vn}</div>
      `;
    }).join('');

    return `
      <div class="card-zen p-6 md:p-10 rounded-2xl fade-in-up max-h-[75vh] overflow-y-auto custom-scrollbar">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4 items-center">
          ${rowsHtml}
        </div>
      </div>
    `;
  }

  // --- 1. SHADOWING ---
  function renderShadowing() {
    const data = LESSON_DATA[currentIndex];
    return `
      <div class="card-zen p-6 md:p-10 rounded-2xl text-center fade-in-up">
        <div class="text-[10px] uppercase tracking-widest text-clay-500 mb-6 font-bold">Listen & Repeat</div>
        <h2 class="font-display text-xl md:text-2xl text-ink-900 leading-relaxed mb-8">${data.en}</h2>
        
        <div class="flex justify-center gap-3 mb-6">
          <button onclick="playAudio(LESSON_DATA[currentIndex].en)" class="flex items-center gap-2 bg-moss-600 text-white px-5 py-2.5 rounded-full hover:bg-moss-700 shadow-sm transition-colors text-sm">
            <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
            Nghe máy đọc
          </button>
          <button id="shadowMicBtn" onclick="startSpeech('en-US', 'shadowInput', 'shadowMicBtn')" class="flex items-center gap-2 border border-clay-300 text-clay-700 bg-white px-5 py-2.5 rounded-full hover:bg-sand-50 transition-colors text-sm shadow-sm">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg>
            Bấm nói
          </button>
        </div>
        
        <textarea id="shadowInput" rows="2" placeholder="Bấm micro và đọc lại câu tiếng Anh ở trên. Máy sẽ viết ra đây để bạn tự đối chiếu..." class="w-full bg-sand-50 border border-sand-200 rounded-xl p-4 text-ink-700 focus:outline-none focus:border-moss-400 resize-none text-sm mb-4"></textarea>
        
        <button onclick="document.getElementById('vnTrans').classList.toggle('hidden')" class="text-xs text-clay-500 hover:text-clay-700 underline mt-2 mb-4 block mx-auto">Hiển thị tiếng Việt</button>
        <p id="vnTrans" class="hidden text-clay-600 italic font-display text-base border-t border-sand-200 pt-4">${data.vn}</p>
      </div>
      ${renderPagination(LESSON_DATA.length, currentIndex, 'next()', 'prev()')}
    `;
  }

  // --- 2. DICTATION ---
  function renderDictation() {
    const data = LESSON_DATA[currentIndex];
    return `
      <div class="card-zen p-6 md:p-8 rounded-2xl fade-in-up">
        <div class="flex justify-between items-center mb-6">
          <div class="text-[10px] uppercase tracking-widest text-clay-500 font-bold">Listen & Type</div>
          <button onclick="playAudio(LESSON_DATA[currentIndex].en)" class="text-moss-600 bg-moss-50 p-3 rounded-full hover:bg-moss-100 transition-colors">
            <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
          </button>
        </div>
        
        <textarea id="dictInput" rows="4" placeholder="Nghe và gõ lại tiếng Anh vào đây..." class="w-full bg-white border border-sand-200 rounded-xl p-4 text-ink-900 focus:outline-none focus:border-moss-400 focus:ring-1 focus:ring-moss-400 resize-none text-base"></textarea>
        
        <div class="mt-4 flex justify-end">
           <button onclick="document.getElementById('dictAns').classList.remove('hidden')" class="bg-ink-800 text-white px-5 py-2 rounded-full hover:bg-ink-900 text-xs">Kiểm tra Đáp án</button>
        </div>

        <div id="dictAns" class="hidden mt-6 bg-moss-50 border border-moss-100 rounded-xl p-5">
           <div class="text-[10px] text-moss-700 font-bold mb-1 uppercase tracking-wider">Nguyên bản:</div>
           <div class="text-ink-900 text-base font-medium">${data.en}</div>
           <div class="text-clay-600 italic text-sm mt-2">${data.vn}</div>
        </div>
      </div>
      ${renderPagination(LESSON_DATA.length, currentIndex, 'next()', 'prev()')}
    `;
  }

  // --- 3 & 4. TRANSLATION ---
  function renderTranslation(direction) {
    const data = LESSON_DATA[currentIndex];
    const isEnToVn = direction === 'en2vn';
    const sourceText = isEnToVn ? data.en : data.vn;
    const targetText = isEnToVn ? data.vn : data.en;
    const langCode = isEnToVn ? 'vi-VN' : 'en-US'; 

    return `
      <div class="card-zen p-6 md:p-8 rounded-2xl fade-in-up">
        <div class="text-[10px] uppercase tracking-widest text-clay-500 mb-4 font-bold">${isEnToVn ? 'Dịch sang tiếng Việt' : 'Dịch sang tiếng Anh'}</div>
        <h2 class="font-display text-lg md:text-xl text-ink-900 leading-relaxed mb-6 bg-sand-50 p-5 rounded-xl border border-sand-100 italic">${sourceText}</h2>
        
        <div class="relative">
          <textarea id="transArea" rows="4" placeholder="Nhập bản dịch hoặc bấm micro..." class="w-full bg-white border border-sand-200 rounded-xl p-4 text-ink-900 focus:outline-none focus:border-moss-400 focus:ring-1 focus:ring-moss-400 resize-none text-base"></textarea>
          
          <button id="micBtn${direction}" onclick="startSpeech('${langCode}', 'transArea', 'micBtn${direction}')" class="absolute bottom-3 right-3 flex items-center gap-2 border border-sand-200 bg-white text-clay-600 px-3 py-1.5 rounded-lg hover:bg-sand-50 transition-all text-xs font-medium shadow-sm">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg>
            Bấm nói
          </button>
        </div>
        
        <div class="mt-4 flex justify-between items-center">
           <p class="text-[10px] text-clay-400">Micro hỗ trợ: ${isEnToVn ? 'Tiếng Việt' : 'English'}</p>
           <button onclick="document.getElementById('transAns').classList.toggle('hidden')" class="bg-clay-600 text-white px-5 py-2 rounded-full hover:bg-clay-700 text-xs transition-colors">Hiện đáp án</button>
        </div>

        <div id="transAns" class="hidden mt-6 bg-moss-50 border border-moss-100 rounded-xl p-5">
           <div class="text-[10px] text-moss-600 font-bold mb-2 uppercase tracking-wider">Bản dịch tham khảo:</div>
           <div class="text-ink-900 text-base font-medium">${targetText}</div>
        </div>
      </div>
      ${renderPagination(LESSON_DATA.length, currentIndex, 'next()', 'prev()')}
    `;
  }

  // --- ĐIỀU HƯỚNG ---
  function renderWorkspace() {
    const ws = document.getElementById('workspace');
    if (currentTab === 'read') ws.innerHTML = renderReading();
    else if (currentTab === 'shadow') ws.innerHTML = renderShadowing();
    else if (currentTab === 'dict') ws.innerHTML = renderDictation();
    else if (currentTab === 'entovn') ws.innerHTML = renderTranslation('en2vn');
    else if (currentTab === 'vntoen') ws.innerHTML = renderTranslation('vntoen');
  }

  window.next = () => { if(currentIndex < LESSON_DATA.length - 1) { currentIndex++; renderWorkspace(); } };
  window.prev = () => { if(currentIndex > 0) { currentIndex--; renderWorkspace(); } };

  // Khởi động
  renderTabs();
  renderWorkspace();
</script>
</body>
</html>
